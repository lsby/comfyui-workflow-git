[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-workflow-git"
version = "0.1.0"
description = "Lightweight native Git version control for ComfyUI workflows"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "lsby" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/lsby/comfyui-workflow-git"
